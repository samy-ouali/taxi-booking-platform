# Optional: run MySQL and phpMyAdmin with Docker instead of XAMPP/MAMP.
#   docker compose up -d
# MySQL:      localhost:3306 (user root, password from DB_PASSWORD in .env)
# phpMyAdmin: http://localhost:8080
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-taxi}
      MYSQL_DATABASE: ${DB_NAME:-taxi_reservation}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
    ports:
      - "8080:80"
    depends_on:
      - db
volumes:
  db_data:
