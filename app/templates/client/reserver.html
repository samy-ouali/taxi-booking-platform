{% extends "base.html" %}
{% block title %}Réserver une course{% endblock %}
{% block content %}
<h2>Réserver une course</h2>
<form method="post" class="form">
    <fieldset>
        <legend>Trajet</legend>
        <label>Adresse de départ <input type="text" name="depart_adresse" required></label>>
        <label>Adresse d'arrivée <input type="text" name="arrivee_adresse" required></label>
    </fieldset>

    <fieldset>
        <legend>Détails</legend>
        <div class="row">
            <label>Nb personnes <input type="number" name="nb_personnes" min="1" value="1" required></label>
            <label>Nb bagages <input type="number" name="nb_bagages" min="0" value="0"></label>
        </div>
        <label>Catégorie de taxi
            <select name="id_categorie" required>
                {% for cat in categories %}
                    <option value="{{ cat.id_categorie }}">
                        {{ cat.libelle }} - {{ cat.capacite_personnes }} pers. / {{ cat.capacite_bagages }} bagages - {{ cat.prix_base }}€ + {{ cat.tarif_km }}€/km
                    </option>
                {% endfor %}
            </select>
        </label>
        <label>Date et heure souhaitées
            <input type="datetime-local" name="date_depart_souhaitee" required>
        </label>
    </fieldset>

    <button type="submit" class="btn btn-primary">Rechercher un chauffeur</button>
</form>
{% endblock %}
